name: AI Company Radar
on:
  push:
    branches: [main]
    paths: ['src/**', 'config/**', 'tests/**', 'pyproject.toml', '.github/workflows/ai-radar.yml', 'scripts/publish_radar.py']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-company-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify code before network access
        run: |
          python -m pip install pytest==8.4.2
          python -m compileall -q src scripts tests
          python -m pytest -q
      - name: Restore most recent durable evidence database
        id: restore
        run: |
          mkdir -p data
          previous_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=radar-database&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name radar-database --dir data
            test -s data/radar.sqlite
          fi
      - name: Collect official evidence and discover candidates
        id: collect
        run: python -m ai_radar collect --registry config/companies.json --max-pages 3
      - name: Export dashboard, data and health report
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          python -m ai_radar export --out radar-output
          cat radar-output/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence for the next run
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-database
          path: data/radar.sqlite
          retention-days: 90
          if-no-files-found: error
      - name: Publish downloadable dashboard
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-company-radar
          path: radar-output/
          retention-days: 90
          if-no-files-found: error
      - name: Update versioned data branch
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: python scripts/publish_radar.py
